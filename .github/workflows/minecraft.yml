name: Minecraft Bedrock Server
on: workflow_dispatch

jobs:
  run-server:
    runs-on: windows-latest
    steps:
    - name: Tải Minecraft Bedrock Server
      run: |
        curl -L -o server.zip https://minecraft.net
        Expand-Archive server.zip -DestinationPath server
    - name: Cài đặt và Chạy ngrok mở cổng 19132
      run: |
        choco install ngrok
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        Start-Process ngrok -ArgumentList "udp 19132"
    - name: Khởi chạy Server
      run: |
        cd server
        ./bedrock_server.exe
